<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissor</title>
</head>

<body>
  <h2>Rock Paper Scissor</h2>
  <button onclick="playGame('rock')">Rock</button>
  <button onclick="playGame('paper')">Paper</button>
  <button onclick="playGame('scissor')">Scissor</button>
  <!-- const randomNum=Math.random();//randomNum is alredy define so we can use it by scope the -->



  <script>

    function playGame(playerMove) {
      const computerMove = pickcomputerMove();
      let result = '';
      if (playerMove === 'scissor') {
        if (computerMove === 'rock') {
          result = 'Loose';
        }
        else if (computerMove === 'paper') {
          result = 'Win';
        }
        else if (computerMove === 'scissor') {
          result = 'Tie';
        }

        else if (playerMove === 'paper') {
          const computerMove = pickcomputerMove();
          let result = '';
          if (computerMove === 'rock') {
            result = 'Win';
          }
          else if (computerMove === 'paper') {
            result = 'Tie';
          }
          else if (computerMove === 'scissor') {
            result = 'Loose';
          }
        }

        else {
          const computerMove = pickcomputerMove();
          let result = '';
          if (computerMove === 'rock') {
            result = 'Tie';
          }
          else if (computerMove === 'paper') {
            result = 'Loose';
          }
          else if (computerMove === 'scissor') {
            result = 'Win';
          }
        }
      }
      
      alert(`You choose ${playerMove}. Computer choose ${computerMove}. Result ${result}`)
    }
    function pickcomputerMove() {
      const randomNum = Math.random();
      let computerMove = '';
      if (randomNum >= 0 && randomNum < 1 / 3) {
        computerMove = 'rock'
      }
      else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
        computerMove = 'paper';
      }
      else if (randomNum >= 2 / 3 && randomNum < 1) {
        computerMove = 'scissor';
      }
      return computerMove;
    }
  </script>

</body>

</html>
